<div class="detail-page">
  <!-- App Bar -->
  <div class="app-bar" [style.background]="themeColor">
    <button class="back-btn" (click)="goBack()">←</button>
    <span class="app-bar-title">{{ social.name }}</span>
  </div>

  <!-- WebView -->
  <div class="webview-container" *ngIf="isWebView">
    <div class="loading-overlay" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Loading</p>
    </div>
    <iframe
      *ngIf="safeUrl"
      [src]="safeUrl"
      class="webview-frame"
      (load)="onIframeLoad()"
      allow="fullscreen"
    ></iframe>
  </div>

  <!-- Detail View -->
  <div class="detail-scroll" *ngIf="!isWebView">
    <!-- Header Image -->
    <div class="header-img-wrap">
      <img
        *ngIf="social.imgUrl && !imgError"
        [src]="social.imgUrl"
        class="header-img"
        (error)="imgError = true"
        alt="{{ social.name }}"
      />
      <div *ngIf="!social.imgUrl || imgError" class="color-header" [style.background]="themeColor">
        <span class="color-header-text">{{ social.name }}</span>
      </div>
    </div>

    <!-- Description + Button -->
    <div class="detail-body">
      <p class="description">{{ social.history }}</p>
      <button class="visit-btn" [style.background]="themeColor" (click)="visitSite()">
        Visit {{ social.name }}
      </button>
    </div>
  </div>
</div>
